<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Napo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>ナポレオン 記録帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="napo-app.css">
</head>
<body>

<div class="app">
  <header class="h">
    <div class="brand">
      <span class="mark">N°</span>
      <h1>ナポレオン 記録帳</h1>
    </div>
    <div class="progress" id="hprog"></div>
  </header>
  <div id="root"></div>
  <footer>napoleon ledger · v.2 · stationery</footer>
</div>

<div class="toast" id="toast"></div>

<script src="napo-shared.js"></script>
<script src="wheel-picker.js"></script>
<script src="swipe-row.js"></script>
<script src="napo-app.js"></script>
<script>
  // tiny header progress updater — listens to storage / each render via MutationObserver
  function updateProg() {
    try {
      const raw = sessionStorage.getItem('napoleon-ledger-v2');
      const s = raw ? JSON.parse(raw) : null;
      const n = (s && s.started) ? (s.games || []).length : 0;
      const N = (s && s.started) ? 10 : 0;
      const txt = (s && s.started) ? `<b>${String(n).padStart(2,'0')}</b> / 10` : 'setup';
      document.getElementById('hprog').innerHTML = txt;
    } catch (e) {}
  }
  updateProg();
  new MutationObserver(updateProg).observe(document.getElementById('root'), { childList: true, subtree: true });
</script>
</body>
</html>
